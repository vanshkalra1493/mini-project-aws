<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Weather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: one narrow column. A big current reading on top, a temperature curve for the day, then a five-day strip. */
:root{
  --bg:#eef3f7; --surface:#ffffff; --ink:#14212b; --muted:#5b6b78; --line:#d5dee6; --accent:#1c6fb8;
  --warm:#d9731f;
  --display:'Fraunces',Georgia,serif; --body:'Public Sans',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1820; --surface:#17232d; --ink:#e8eff4; --muted:#92a3b0; --line:#2a3b48; --accent:#6db3f0; --warm:#f0a35c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1820; --surface:#17232d; --ink:#e8eff4; --muted:#92a3b0; --line:#2a3b48; --accent:#6db3f0; --warm:#f0a35c;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);padding:24px 16px 40px}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{font:700 1.25rem/1.2 var(--display);margin:0}
.controls{display:flex;gap:8px;align-items:center}
select,.seg button{font:500 .9rem var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
select{min-width:150px}
.seg{display:flex}
.seg button{border-radius:0;cursor:pointer;padding:8px 12px}
.seg button:first-child{border-radius:8px 0 0 8px}
.seg button:last-child{border-radius:0 8px 8px 0;border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.now{display:grid;grid-template-columns:auto 1fr;gap:8px 20px;align-items:center}
.temp{font:700 4.5rem/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.temp sup{font-size:1.6rem;color:var(--muted);vertical-align:top;position:relative;top:.5rem;margin-left:2px}
.cond{font:500 1.15rem var(--body)}
.sub{color:var(--muted);font-size:.9rem}
.icon{width:72px;height:72px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.stat dt{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat dd{margin:2px 0 0;font-weight:600;font-variant-numeric:tabular-nums}
h2{font:700 1rem var(--display);margin:0 0 12px}
#chart{width:100%;height:auto;display:block}
#chart text{fill:var(--muted);font:500 11px var(--body)}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;list-style:none;margin:0;padding:0}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:8px;border:1px solid var(--line);text-align:center}
.day:first-child{border-color:var(--accent)}
.day b{font-size:.85rem}
.day svg{width:36px;height:36px}
.day .hi{font-weight:600;font-variant-numeric:tabular-nums}
.day .lo{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.day .rain{font-size:.75rem;color:var(--accent);font-variant-numeric:tabular-nums}
.note{font-size:.8rem;color:var(--muted)}
@media (max-width:420px){.temp{font-size:3.5rem}.icon{width:56px;height:56px}.days{gap:4px}}
</style>
</head>
<body>
<main>
  <header>
    <h1>Mini Weather</h1>
    <div class="controls">
      <label for="city" class="sub">City</label>
      <select id="city"></select>
      <div class="seg" role="group" aria-label="Temperature unit">
        <button id="uC" type="button" aria-pressed="true">°C</button>
        <button id="uF" type="button" aria-pressed="false">°F</button>
      </div>
    </div>
  </header>

  <section class="card" aria-live="polite">
    <div class="now">
      <div><span class="temp" id="temp">--</span></div>
      <div>
        <div id="icon" class="icon"></div>
      </div>
    </div>
    <div class="cond" id="cond"></div>
    <div class="sub" id="where"></div>
    <dl class="stats">
      <div class="stat"><dt>Feels like</dt><dd id="feels"></dd></div>
      <div class="stat"><dt>Humidity</dt><dd id="hum"></dd></div>
      <div class="stat"><dt>Wind</dt><dd id="wind"></dd></div>
      <div class="stat"><dt>Sunrise / sunset</dt><dd id="sun"></dd></div>
    </dl>
  </section>

  <section class="card">
    <h2>Temperature today</h2>
    <svg id="chart" viewBox="0 0 600 200" role="img" aria-label="Hourly temperature for today"></svg>
  </section>

  <section class="card">
    <h2>Next 5 days</h2>
    <ul class="days" id="days"></ul>
  </section>

  <p class="note">Sample data for November 18, 2026. Values are typical for the season and do not update. This page cannot load live forecasts.</p>
</main>

<script>
// Typical mid-November conditions per city. Temperatures in °C.
var CITIES = [
  {n:"Mumbai, India",     lo:23, hi:33, hum:62, wind:11, rise:"06:42", set:"17:58", base:[0,0,1,0,0], rain:[0,0,5,0,0]},
  {n:"Delhi, India",      lo:12, hi:26, hum:48, wind:7,  rise:"06:43", set:"17:24", base:[5,0,0,1,0], rain:[0,0,0,5,0]},
  {n:"Bengaluru, India",  lo:17, hi:28, hum:66, wind:12, rise:"06:09", set:"17:49", base:[1,2,1,0,2], rain:[20,45,25,5,40]},
  {n:"London, UK",        lo:5,  hi:11, hum:82, wind:19, rise:"07:12", set:"16:07", base:[3,2,3,1,3], rain:[55,35,60,20,50]},
  {n:"New York, USA",     lo:3,  hi:11, hum:58, wind:16, rise:"06:42", set:"16:44", base:[0,1,0,2,0], rain:[5,15,0,30,5]},
  {n:"Tokyo, Japan",      lo:9,  hi:17, hum:55, wind:9,  rise:"06:19", set:"16:36", base:[0,0,1,0,3], rain:[0,5,20,5,55]},
  {n:"Sydney, Australia", lo:16, hi:24, hum:63, wind:17, rise:"05:48", set:"19:40", base:[0,1,0,3,1], rain:[10,20,5,60,30]}
];
// Condition codes: 0 sunny, 1 partly cloudy, 2 cloudy, 3 rain
var NAMES = ["Sunny","Partly cloudy","Cloudy","Rain"];
var DOW = ["Wed","Thu","Fri","Sat","Sun"];
var unit = "C";
try { unit = localStorage.getItem("mw-unit") || "C"; } catch(e) {}

function T(c){ return Math.round(unit==="C" ? c : c*9/5+32); }
function deg(){ return "°"+unit; }
function kmh(v){ return unit==="C" ? Math.round(v)+" km/h" : Math.round(v*0.621)+" mph"; }

function icon(code){
  var sun='<circle cx="32" cy="32" r="11" fill="#f2b632"/><g stroke="#f2b632" stroke-width="3" stroke-linecap="round"><path d="M32 8v6M32 50v6M8 32h6M50 32h6M15 15l4 4M45 45l4 4M15 49l4-4M45 19l4-4"/></g>';
  var cloud='<path d="M20 46h26a9 9 0 0 0 1-17.9A13 13 0 0 0 22 31a8 8 0 0 0-2 15z" fill="#9db0bf"/>';
  var cloud2='<path d="M18 44h28a10 10 0 0 0 1-19.9A14 14 0 0 0 20 27a8.5 8.5 0 0 0-2 17z" fill="#8296a6"/>';
  var drops='<g stroke="#3f8fd6" stroke-width="3" stroke-linecap="round"><path d="M24 50l-2 6M33 50l-2 6M42 50l-2 6"/></g>';
  var body = code===0 ? sun
    : code===1 ? '<g transform="translate(-6,-6) scale(.8)">'+sun+'</g><g transform="translate(6,6)">'+cloud+'</g>'
    : code===2 ? cloud2
    : '<g transform="translate(0,-6)">'+cloud2+'</g>'+drops;
  return '<svg viewBox="0 0 64 64" aria-hidden="true">'+body+'</svg>';
}

function hourly(c, i){
  // Smooth daily curve: minimum near 06:00, maximum near 15:00.
  var out=[];
  for(var h=0; h<24; h+=3){
    var phase=(h-15)/24*2*Math.PI;
    var shift = c.base[0]===3 ? -1 : 0;
    out.push(c.lo + (c.hi-c.lo)*(0.5+0.5*Math.cos(phase)) + shift);
  }
  return out;
}

function drawChart(vals){
  var svg=document.getElementById("chart");
  var W=600,H=200,L=40,R=16,Tp=20,B=34;
  var d=vals.map(T), mn=Math.min.apply(null,d), mx=Math.max.apply(null,d);
  var lo=Math.floor(mn/2)*2-2, hi=Math.ceil(mx/2)*2+2;
  var x=function(i){return L+(W-L-R)*i/(vals.length-1)};
  var y=function(v){return Tp+(H-Tp-B)*(1-(v-lo)/(hi-lo))};
  var s="";
  var step = (hi-lo)>20 ? 10 : 5;
  for(var g=Math.ceil(lo/step)*step; g<=hi; g+=step){
    s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(g)+'" y2="'+y(g)+'" stroke="var(--line)" stroke-width="1"/>';
    s+='<text x="'+(L-6)+'" y="'+(y(g)+4)+'" text-anchor="end">'+g+'°</text>';
  }
  var pts=d.map(function(v,i){return x(i)+","+y(v)}).join(" ");
  var area="M"+x(0)+","+(H-B)+" L"+pts.replace(/ /g," L")+" L"+x(d.length-1)+","+(H-B)+" Z";
  s+='<path d="'+area+'" fill="var(--accent)" opacity=".12"/>';
  s+='<polyline points="'+pts+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>';
  d.forEach(function(v,i){
    s+='<text x="'+x(i)+'" y="'+(H-12)+'" text-anchor="middle">'+("0"+i*3).slice(-2)+':00</text>';
  });
  var mi=d.indexOf(mx);
  s+='<circle cx="'+x(mi)+'" cy="'+y(mx)+'" r="5" fill="var(--warm)"/>';
  s+='<text x="'+x(mi)+'" y="'+(y(mx)-10)+'" text-anchor="middle" style="fill:var(--ink);font-weight:600">'+mx+'°</text>';
  svg.innerHTML=s;
}

function render(){
  var c=CITIES[document.getElementById("city").selectedIndex];
  var code=c.base[0];
  var nowT=c.lo+(c.hi-c.lo)*0.78; // early evening reading, 18:44 local to the viewer
  nowT = c.lo+(c.hi-c.lo)*0.62;
  document.getElementById("temp").innerHTML=T(nowT)+"<sup>"+deg()+"</sup>";
  document.getElementById("icon").innerHTML=icon(code);
  document.getElementById("cond").textContent=NAMES[code];
  document.getElementById("where").textContent=c.n+" · Wed, Nov 18";
  document.getElementById("feels").textContent=T(nowT-(c.wind>15?2:0)+(c.hum>70?1:0))+deg();
  document.getElementById("hum").textContent=c.hum+"%";
  document.getElementById("wind").textContent=kmh(c.wind);
  document.getElementById("sun").textContent=c.rise+" / "+c.set;
  drawChart(hourly(c));
  var html="";
  for(var i=0;i<5;i++){
    var k=c.base[i], dh=c.hi+(i%2?-1:1)*(i>1?1:0), dl=c.lo+(i%3===0?0:-1);
    html+='<li class="day"><b>'+(i===0?"Today":DOW[i])+'</b>'+icon(k)+
      '<span class="hi">'+T(dh)+'°</span><span class="lo">'+T(dl)+'°</span>'+
      '<span class="rain">'+c.rain[i]+'%</span></li>';
  }
  document.getElementById("days").innerHTML=html;
  document.getElementById("uC").setAttribute("aria-pressed",unit==="C");
  document.getElementById("uF").setAttribute("aria-pressed",unit==="F");
}

var sel=document.getElementById("city");
CITIES.forEach(function(c,i){var o=document.createElement("option");o.value=i;o.textContent=c.n;sel.appendChild(o);});
try{var saved=localStorage.getItem("mw-city"); if(saved!==null) sel.selectedIndex=+saved;}catch(e){}
sel.addEventListener("change",function(){try{localStorage.setItem("mw-city",sel.selectedIndex)}catch(e){} render();});
["C","F"].forEach(function(u){
  document.getElementById("u"+u).addEventListener("click",function(){unit=u;try{localStorage.setItem("mw-unit",u)}catch(e){} render();});
});
render();
</script>
</body>
</html>
